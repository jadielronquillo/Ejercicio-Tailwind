<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegación móvil · Solución | Tailwind CSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">
    <a href="index.html" class="mb-6 inline-flex rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">← Regresar al inicio</a>
    <nav aria-label="Principal" class="rounded-xl bg-white p-4">
      <div class="flex items-center justify-between">
        <a href="#inicio" class="text-xl font-bold">Mi sitio</a>
        <button id="menuBtn" type="button" aria-controls="menu" aria-expanded="false"
          class="rounded-lg border px-3 py-2 md:hidden">Menú</button>
      </div>
      <div id="menu" class="mt-4 hidden flex-col gap-3 md:flex md:flex-row">
        <a href="#inicio" class="hover:underline">Inicio</a>
        <a href="#cursos" class="hover:underline">Cursos</a>
      </div>
    </nav>
    <section id="inicio" class="mt-8"><h1>Inicio</h1></section>
    <section id="cursos" class="mt-8"><h2>Cursos</h2></section>
    <script>
      const boton = document.querySelector('#menuBtn');
      const menu = document.querySelector('#menu');
      boton.addEventListener('click', () => {
        const abierto = boton.getAttribute('aria-expanded') !== 'true';
        boton.setAttribute('aria-expanded', String(abierto));
        menu.classList.toggle('hidden', !abierto);
        menu.classList.toggle('flex', abierto);
      });
    </script>
  </main>
</body>
</html>

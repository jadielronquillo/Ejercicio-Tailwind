<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario accesible · Solución | Tailwind CSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">
    <a href="index.html" class="mb-6 inline-flex rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">← Regresar al inicio</a>
    <form id="registro" class="mx-auto max-w-md rounded-xl bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold">Registro al taller</h1>
      <label for="correo" class="mt-5 block font-medium">Correo</label>
      <input id="correo" name="correo" type="email" required autocomplete="email"
        class="mt-2 w-full rounded-lg border border-slate-400 p-3 focus:border-blue-700 focus:ring-2 focus:ring-blue-700"
        placeholder="nombre@ejemplo.com">
      <button class="mt-5 rounded-lg bg-blue-700 px-5 py-2 font-semibold text-white" type="submit">Registrar</button>
      <p id="mensaje" role="status" class="mt-3 text-green-800"></p>
    </form>
    <script>
      const formulario = document.querySelector('#registro');
      formulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        document.querySelector('#mensaje').textContent =
          'Demostración completada. No se enviaron datos.';
        formulario.reset();
      });
    </script>
  </main>
</body>
</html>

<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página integradora de cursos · Solución | Tailwind CSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">
    <a href="index.html" class="mb-6 inline-flex rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">← Regresar al inicio</a>
    <header class="flex flex-col gap-3 border-b border-slate-300 pb-4 sm:flex-row sm:items-center sm:justify-between">
      <a href="#" class="text-xl font-bold">Aula web</a>
      <nav aria-label="Principal" class="flex gap-4">
        <a href="#cursos" class="hover:underline">Cursos</a>
        <a href="#contacto" class="hover:underline">Contacto</a>
      </nav>
    </header>
    <section class="py-10">
      <h1 class="text-3xl font-bold md:text-5xl">Aprende desarrollo web</h1>
      <p class="mt-4 text-slate-600">Practica con proyectos pequeños.</p>
    </section>
    <section id="cursos" aria-label="Cursos" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <article class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="text-xl font-bold">HTML</h2>
        <p class="mt-2">Construye la estructura.</p>
      </article>
      <article class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="text-xl font-bold">Tailwind</h2>
        <p class="mt-2">Diseña la presentación.</p>
      </article>
      <article class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="text-xl font-bold">JavaScript</h2>
        <p class="mt-2">Programa la interacción.</p>
      </article>
    </section>
    <footer id="contacto" class="mt-10 border-t border-slate-300 pt-4">
      <a href="mailto:docente@example.com" class="underline">
        Contacto de ejemplo
      </a>
    </footer>
  </main>
</body>
</html>

<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla adaptable · Solución | Tailwind CSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-900 sm:p-8 dark:bg-slate-950 dark:text-slate-100">
  <main class="mx-auto max-w-5xl">
    <a href="index.html" class="mb-6 inline-flex rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">← Regresar al inicio</a>
    <div class="overflow-x-auto rounded-lg border border-slate-300">
      <table class="min-w-[600px] w-full border-collapse bg-white">
        <caption class="p-4 text-left font-bold">Avance de prácticas</caption>
        <thead class="bg-slate-200 text-left">
          <tr>
            <th scope="col" class="p-3">Estudiante</th>
            <th scope="col" class="p-3">Práctica</th>
            <th scope="col" class="p-3">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t border-slate-300 hover:bg-slate-50">
            <th scope="row" class="p-3 text-left font-medium">Ana</th>
            <td class="p-3">Grid</td>
            <td class="p-3 text-green-800">Entregada</td>
          </tr>
          <tr class="border-t border-slate-300 hover:bg-slate-50">
            <th scope="row" class="p-3 text-left font-medium">Luis</th>
            <td class="p-3">Formulario</td>
            <td class="p-3 text-amber-800">Pendiente</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
